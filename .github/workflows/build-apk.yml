name: Build HorizonZ Launcher APK

on:
  push:
    branches: [ "main", "master", "android" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master", "android" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-update-zip:
    name: Auto-Extract Update/ ZIP to Main Source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check & Extract Any ZIP in Update/ Folder Over Main Source
        continue-on-error: true
        run: |
          set +e
          for zf in Update/*.zip; do
            if [ -f "$zf" ]; then
              unzip -q -o "$zf" "scripts/*" || true
            fi
          done
          python3 scripts/apply_update_zip.py
          if [ -f ".auto_update_applied.txt" ]; then
            APPLIED_ZIPS="$(cat .auto_update_applied.txt)"
            rm -f .auto_update_applied.txt
            git checkout HEAD -- .github/workflows/ 2>/dev/null || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git reset HEAD .github/workflows/ 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "chore(auto-update): extract ${APPLIED_ZIPS} from Update/ into main source" || true
              git push origin "HEAD:${GITHUB_REF_NAME}" || true
            fi
          fi
          exit 0

  build-horizonz-apk:
    name: Build HorizonZ 3.2 APK (${{ matrix.abi }})
    needs: apply-update-zip
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust_target: aarch64-linux-android
            clang_prefix: aarch64-linux-android28
          - abi: armeabi-v7a
            rust_target: armv7-linux-androideabi
            clang_prefix: armv7a-linux-androideabi28

    steps:
      - name: Checkout Latest Main Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Ensure Any Remaining Update/ ZIP is Applied in Build Workspace
        run: |
          for zf in Update/*.zip; do
            if [ -f "$zf" ]; then
              unzip -q -o "$zf" "scripts/*" || true
            fi
          done
          python3 scripts/apply_update_zip.py
          rm -f .auto_update_applied.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & Install Platform 35 + NDK 28.2.13676358
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > packaging/android/local.properties

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"

          NDK_VERSION="28.2.13676358"
          NDK_DIR="$ANDROID_HOME/ndk/$NDK_VERSION"
          for attempt in 1 2 3; do
            if [ -f "$NDK_DIR/source.properties" ]; then
              break
            fi
            if "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "ndk;$NDK_VERSION" && [ -f "$NDK_DIR/source.properties" ]; then
              break
            fi
            rm -rf "$NDK_DIR" "$ANDROID_HOME/temp"
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
          test -f "$NDK_DIR/source.properties"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Set up Rust Toolchain (${{ matrix.rust_target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Checkout Pinned Vasysik/horizon-android (150a414) & Apply HorizonZ 3.2 Patches
        run: |
          rm -rf /tmp/horizon-upstream
          UPSTREAM_TARGET_COMMIT="150a414b09a18c900489d9462a7fc035dae744b7"
          git init /tmp/horizon-upstream
          git -C /tmp/horizon-upstream remote add origin https://github.com/Vasysik/horizon-android.git
          if git -C /tmp/horizon-upstream fetch --depth 1 origin "$UPSTREAM_TARGET_COMMIT"; then
            git -C /tmp/horizon-upstream checkout FETCH_HEAD
          else
            git clone --branch android https://github.com/Vasysik/horizon-android.git /tmp/horizon-upstream
            git -C /tmp/horizon-upstream checkout "$UPSTREAM_TARGET_COMMIT"
          fi
          rsync -a --delete --exclude='packaging/android' --exclude='scripts' --exclude='Update' --exclude='BBS' --exclude='docs/screenshots' --exclude='README.md' --exclude='.local' --exclude='.git' --exclude='.github' /tmp/horizon-upstream/ ./
          if [ -d "/tmp/horizon-upstream/docs" ]; then
            mkdir -p docs
            cp -rf /tmp/horizon-upstream/docs/* docs/ 2>/dev/null || true
          fi
          if [ -d "/tmp/horizon-upstream/scripts" ]; then
            mkdir -p scripts
            cp -rn /tmp/horizon-upstream/scripts/* scripts/ 2>/dev/null || true
          fi
          if [ -f "/tmp/horizon-upstream/packaging/android/bedrock-controls.json" ]; then
            cp -f "/tmp/horizon-upstream/packaging/android/bedrock-controls.json" packaging/android/bedrock-controls.json
          fi
          if [ -f "BBS/sync_and_merge_bbs.py" ]; then
            python3 BBS/sync_and_merge_bbs.py /tmp/horizon-upstream
          else
            python3 scripts/patch_horizon_direct_boot.py
          fi
          rm -rf /tmp/horizon-upstream
          rm -f packaging/android/assets/bedrock-controls.json

          rustup target add "${{ matrix.rust_target }}"

      - name: Cache Rust Engine Build
        uses: Swatinem/rust-cache@v2
        with:
          key: horizon-real-engine-v32-150a414-${{ matrix.rust_target }}

      - name: Compile Real Horizon Rust Engine (libhorizon_android.so) & Prestage Controls (${{ matrix.abi }})
        run: |
          mkdir -p .local/android/gradle-jni/${{ matrix.abi }}
          mkdir -p .local/android/gradle-assets
          cp -f LICENSE .local/android/gradle-assets/LICENSE.txt || cp -f LICENSE.txt .local/android/gradle-assets/LICENSE.txt || true
          cp -f THIRD_PARTY_NOTICES.md .local/android/gradle-assets/ || true

          APK_URL_077="https://github.com/Vasysik/horizon-android/releases/download/v0.7.7/Horizon-Android-0.7.7-${{ matrix.abi }}.apk"
          APK_URL_076="https://github.com/Vasysik/horizon-android/releases/download/v0.7.6/Horizon-Android-0.7.6-${{ matrix.abi }}.apk"
          APK_URL_075="https://github.com/Vasysik/horizon-android/releases/download/v0.7.5/Horizon-Android-0.7.5-${{ matrix.abi }}.apk"
          if curl -fsSL -L "$APK_URL_077" -o /tmp/upstream_assets.apk || curl -fsSL -L "$APK_URL_076" -o /tmp/upstream_assets.apk || curl -fsSL -L "$APK_URL_075" -o /tmp/upstream_assets.apk; then
            unzip -q -o /tmp/upstream_assets.apk "assets/*" -d /tmp/upstream_assets_dir || true
            if [ -d "/tmp/upstream_assets_dir/assets" ]; then
              cp -rf /tmp/upstream_assets_dir/assets/* .local/android/gradle-assets/ || true
            fi
            rm -rf /tmp/upstream_assets.apk /tmp/upstream_assets_dir
          fi

          python3 scripts/prestage_controls_and_wallpapers.py

          TOOLCHAIN_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$TOOLCHAIN_BIN:$PATH"
          export HORIZON_ANDROID_PUBLIC=1
          export HORIZON_ANDROID_BUILD_COMMIT="$(git rev-parse --short=12 HEAD 2>/dev/null || echo 'horizonz32')"
          export HORIZON_ANDROID_BUILD_DIRTY="false"
          export CARGO_PROFILE_RELEASE_LTO=false
          export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
          export CARGO_PROFILE_RELEASE_OPT_LEVEL=2

          TRIPLE_UNDERSCORE="$(echo "${{ matrix.rust_target }}" | tr '-' '_')"
          TRIPLE_UPPER="$(echo "$TRIPLE_UNDERSCORE" | tr '[:lower:]' '[:upper:]')"
          export "CC_${TRIPLE_UNDERSCORE}=$TOOLCHAIN_BIN/${{ matrix.clang_prefix }}-clang"
          export "CXX_${TRIPLE_UNDERSCORE}=$TOOLCHAIN_BIN/${{ matrix.clang_prefix }}-clang++"
          export "AR_${TRIPLE_UNDERSCORE}=$TOOLCHAIN_BIN/llvm-ar"
          export "CARGO_TARGET_${TRIPLE_UPPER}_LINKER=$TOOLCHAIN_BIN/${{ matrix.clang_prefix }}-clang"

          EXTRA_CARGO_ARGS=""
          if [ "${{ matrix.abi }}" = "armeabi-v7a" ]; then
            EXTRA_CARGO_ARGS="--no-default-features --features audio"
          fi

          set +e
          cargo build --release -p horizon-android --target ${{ matrix.rust_target }} $EXTRA_CARGO_ARGS 2>&1 | tee cargo_build.log
          CARGO_EXIT=${PIPESTATUS[0]}
          if [ "$CARGO_EXIT" -ne 0 ]; then
            tail -n 120 cargo_build.log >> "$GITHUB_STEP_SUMMARY"
            exit "$CARGO_EXIT"
          fi

          cp -f "target/${{ matrix.rust_target }}/release/libhorizon_android.so" ".local/android/gradle-jni/${{ matrix.abi }}/libhorizon_android.so"
          "$TOOLCHAIN_BIN/llvm-strip" --strip-unneeded ".local/android/gradle-jni/${{ matrix.abi }}/libhorizon_android.so" || true
          ls -lh ".local/android/gradle-jni/${{ matrix.abi }}/libhorizon_android.so"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Signing Keystore & Assemble APK (${{ matrix.abi }})
        working-directory: packaging/android
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          set +e
          gradle assembleRelease -Pabi=${{ matrix.abi }} -PminSdk=28 --no-daemon --stacktrace 2>&1 | tee gradle_build.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          if [ "$GRADLE_EXIT" -ne 0 ]; then
            tail -n 120 gradle_build.log >> "$GITHUB_STEP_SUMMARY"
            exit "$GRADLE_EXIT"
          fi
          mkdir -p ../../dist
          APK_FOUND="$(find build/outputs/apk/release ../../.local/android/gradle-build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)"
          cp -f "$APK_FOUND" "../../dist/HorizonZ-Launcher-3.2-${{ matrix.abi }}.apk"
          ls -lh ../../dist/

      - name: Upload APK Artifact (${{ matrix.abi }})
        uses: actions/upload-artifact@v4
        with:
          name: HorizonZ-Launcher-3.2-${{ matrix.abi }}
          path: dist/HorizonZ-Launcher-3.2-${{ matrix.abi }}.apk
          if-no-files-found: error

  publish-release:
    name: Publish HorizonZ 3.2 Release APKs
    needs: build-horizonz-apk
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download All Built APK Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-apks
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: release-apks
        run: |
          sha256sum *.apk > SHA256SUMS.txt
          ls -lh

      - name: Create or Update Latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: horizonz-v3.2.0-build-${{ github.run_number }}
          name: "HorizonZ - Launcher v3.2 (Build #${{ github.run_number }} • Android Fork Release • ARM64 & ARM32)"
          body: |
            - **What's New in v3.2 (`HZ-DIRECT-BOOT-MANAGER-SHADERS-MODS-v3.2`)**:
              - **Direct Boot into Minecraft 26.3 & `"The wardrobe index is damaged."` Resolution (`HorizonNativeBridge.kt`, `HorizonActivity.java`, `scripts/patch_horizon_direct_boot.py`)**:
                - Separated HorizonZ's per-account skin/cape tracking into `wardrobe/zalith-wardrobe-selections.json` and removed custom `"selections"` writes from `wardrobe/wardrobe.json` (which caused `Vasysik/horizon-android`'s internal `wardrobe.rs` to return `Err("The wardrobe index is damaged.")` and abort `Launcher::action` before starting `self.game`).
                - Updated `Launcher::draw_pages` in `scripts/patch_horizon_direct_boot.py` to unconditionally return `Ok(())` when `HORIZON_SHOW_INTERNAL_UI` is unset so the internal `Horizon Android 0.7.7` egui screen is never shown, added automatic `wardrobe.json` cleanup + retry and `horizon-appearance.json` preservation around `self.action(events)`, and patched `wardrobe.rs` to self-heal damaged wardrobe index files.
              - **Manager (`CleanFilesViewport`) Category Isolation & Mod Update Fix (`ZalithMainActivity.kt`, `HorizonNativeBridge.kt`)**:
                - Replaced the two racing `LaunchedEffect` blocks in `CleanFilesViewport` (`rawList` and `filteredList`) with a single atomic `LaunchedEffect(currentFolder, searchQuery, filterEnabledOnly, sortMode, refreshCount, profileSlot)` that immediately filters `filteredList` by `it.folder == currentFolder`, strictly filters files by extension per category, and calls `getInstalledStoreVersionsMap` once outside the item loop so switching to **Shader Packs**, **Resource Packs**, **Saves**, **Modpacks**, or **Screenshots** never displays **Mods**.
                - Fixed `ensureValidHorizonModZip` so `forceUpdateVersion = true` always updates `version = "$finalVersion"` inside `horizon-mod.toml` (even when `mod.wasm` is present) and updates `api = "0.2"`, and resolved the higher of `modDetail.version` and `installedVersionsMap` in `CleanFilesViewport` so updating a mod immediately updates its version badge and clears the `↑ Update` indicator.
              - **In-Game Shader Packs (`horizon-graphics.txt`) & Mods Activation (`HorizonNativeBridge.kt`, `scripts/patch_horizon_direct_boot.py`)**:
                - Connected shader activation in `isContentItemEnabled`, `setContentItemEnabled`, `getActiveShaderPackFileName`, and `apply_horizonz_shader_and_agent_config` to Horizon 26.3's authoritative `horizon-graphics.txt` (`pickedShaderPack:<fileName>`) as well as `HORIZON_SHADER_PACK`, removed unknown `description`/`authors` keys from `ensureValidHorizonShaderZip` (`horizon-shaders.toml` `schema = 1`), and bundled upstream `crates/horizon-shader-api/packs/golden_hour` into `packaging/android/assets/builtin-shaders/golden_hour.hshader`.
                - Restored per-mod `horizon-mixins` compilation with individual rollback guards in `scripts/patch_horizon_direct_boot.py` so compatible official native mods (`zoom`, `fps-overlay`, `keystrokes`, `minimap`, `coords-hud`, `recipes`) compile directly into `libhorizon_android.so`.
              - **Eliminated Duplicate Processes & Background Overhead (`ZalithMainActivity.kt`, `HorizonNativeBridge.kt`, `HorizonActivity.java`)**:
                - Calls `finish()` on `ZalithMainActivity` 1.8s after `HorizonActivity` (`:game`) establishes its surface so no duplicate launcher UI process remains in RAM during gameplay, caches `homeDirsInitialized` in `ensureHomeDirectories` so `engine-data.zip` is never re-read into memory on bridge calls, throttles `HorizonSplashOverlayView` disk polling to `180ms`, and skips starting `HorizonZ-GeminiAgentBridge` when no API key is configured.
          files: |
            release-apks/*.apk
            release-apks/SHA256SUMS.txt
          prerelease: false
